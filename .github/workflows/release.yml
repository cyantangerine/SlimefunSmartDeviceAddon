name: Build & Release

# 自动打包并发布 Release：
#   - 推送 v* 标签（如 v1.0.1）时自动发版
#   - 也可在 Actions 页面手动触发并指定标签
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签，例如 v1.0.1'
        required: true
        type: string

# 允许创建 Release 并上传产物
permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Slimefun 的 Folia fork（DEV-SNAPSHOT）在中央 / jitpack 上拉不到，
      # 因此用仓库内 lib/ 的 jar 安装到本地 Maven 仓库，覆盖 jitpack 坐标。
      - name: Install local Slimefun Folia jar
        run: |
          mvn -B install:install-file \
            -Dfile=lib/Slimefun-DEV-SNAPSHOT.jar \
            -DpomFile=lib/Slimefun4-clean.pom

      # -nsu 禁止检查远程 SNAPSHOT 更新，确保用上一步本地安装的 Folia jar，
      # 而不被 jitpack 上可能存在的同名（非 Folia）DEV-SNAPSHOT 覆盖。
      - name: Build plugin jar
        run: mvn -B -nsu clean package -DskipTests

      - name: Locate built jar
        id: built
        shell: bash
        run: |
          jar=$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' | head -n 1)
          if [ -z "$jar" ]; then
            echo "::error::未在 target/ 找到构建产物 jar"
            exit 1
          fi
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "file=$(basename "$jar")" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
          JAR_PATH: ${{ steps.built.outputs.path }}
        shell: bash
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          echo "发布标签: $tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            # 已存在的 Release（例如手动建的 pre-release）：转为正式版、刷新标题。
            gh release edit "$tag" --prerelease=false --draft=false --title "$tag"

            # 清理旧产物，但任何删除失败都不能阻断发版（|| true 容错）。
            gh release view "$tag" --json assets --jq '.assets[].id' 2>/dev/null | while read -r id; do
              [ -n "$id" ] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null 2>&1 || true
            done

            # 用规范名上传，--clobber 兜底覆盖同名旧文件，
            # 保证即使上面删除失败，release 里也只留一个最新的 jar。
            asset_name="SlimefunSmartDeviceAddon.${tag}.jar"
            cp "$JAR_PATH" "/tmp/$asset_name"
            gh release upload "$tag" "/tmp/$asset_name" --clobber
          else
            gh release create "$tag" "$JAR_PATH" --title "$tag" --generate-notes
          fi

      # 同步发布到鬼斩资源站（可选：未配置 GZ_TOKEN 时自动跳过）。
      # 复用同一次 CI 构建出的 jar，保证鬼斩与 GitHub Release 的产物完全一致。
      - name: Publish version to Guizhan Resources
        env:
          GZ_TOKEN: ${{ secrets.GZ_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
          JAR_PATH: ${{ steps.built.outputs.path }}
          GZ_PROJECT: NdmIOCAU
          GZ_API: https://resources.guizhanss.com/api/v1
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${GZ_TOKEN:-}" ]; then
            echo "::notice::未配置 GZ_TOKEN，跳过鬼斩资源站发布"
            exit 0
          fi

          if [ "$REF_TYPE" = "tag" ]; then tag="$REF_NAME"; else tag="$INPUT_TAG"; fi
          echo "鬼斩发布版本: $tag"

          # 用与 GitHub Release 完全一致的文件名，且为同一次构建产物。
          asset_name="SlimefunSmartDeviceAddon.${tag}.jar"
          gz_jar="/tmp/$asset_name"
          cp "$JAR_PATH" "$gz_jar"

          # ---- 诊断：确认 token 有效性与项目可见性（不打印 token） ----
          echo "=== diag: GET /users/@me ==="
          curl -sS -w ' |HTTP=%{http_code}' -H "Authorization: Bearer $GZ_TOKEN" "$GZ_API/users/@me" | head -c 600
          echo
          echo "=== diag: GET channels ==="
          chan_raw=$(curl -sS -w ' |HTTP=%{http_code}' -H "Authorization: Bearer $GZ_TOKEN" "$GZ_API/projects/$GZ_PROJECT/channels")
          printf '%s\n' "$chan_raw" | head -c 1200
          echo

          # 从响应体里解析默认 channel slug；取不到则 fallback 到 release。
          chan_body="${chan_raw% |HTTP=*}"
          channel="release"
          c=$(printf '%s' "$chan_body" | jq -r '.data[]? | select(.is_default == true) | .slug' 2>/dev/null | head -n1)
          if [ -n "$c" ] && [ "$c" != "null" ]; then channel="$c"; fi
          echo "使用 channel: $channel"

          # ---- 诊断 + 幂等：列出已有版本 ----
          echo "=== diag: GET versions ==="
          ver_raw=$(curl -sS -w ' |HTTP=%{http_code}' -H "Authorization: Bearer $GZ_TOKEN" "$GZ_API/projects/$GZ_PROJECT/versions?search=$tag")
          printf '%s\n' "$ver_raw" | head -c 1200
          echo
          ver_body="${ver_raw% |HTTP=*}"
          existing=$(printf '%s' "$ver_body" | jq -r --arg v "$tag" '.data[]? | select(.version == $v) | .id' 2>/dev/null | head -n1)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            echo "::notice::鬼斩已存在版本 $tag（id=$existing），跳过创建"
            exit 0
          fi

          # changelog 与 GitHub Release 说明保持一致。
          changelog="对应 GitHub Release: https://github.com/cyantangerine/SlimefunSmartDeviceAddon/releases/tag/$tag"
          if gh release view "$tag" --json body --jq .body >/tmp/gz_changelog.md 2>/dev/null && [ -s /tmp/gz_changelog.md ]; then
            changelog=$(cat /tmp/gz_changelog.md)
          fi

          data=$(jq -nc \
            --arg channel "$channel" \
            --arg version "$tag" \
            --arg name "$tag" \
            --arg changelog "$changelog" \
            --arg file "$asset_name" \
            '{channel:$channel, version:$version, name:$name, changelog:$changelog, files:[$file]}')

          echo "创建鬼斩版本..."
          post_raw=$(curl -sS -w ' |HTTP=%{http_code}' -X POST \
            -H "Authorization: Bearer $GZ_TOKEN" \
            -F "data=$data" \
            -F "$asset_name=@$gz_jar" \
            "$GZ_API/projects/$GZ_PROJECT/versions")
          printf '%s\n' "$post_raw" | head -c 2000
          echo
          post_body="${post_raw% |HTTP=*}"
          if printf '%s' "$post_body" | jq -e '.data.id != null' >/dev/null 2>&1; then
            echo "鬼斩版本发布成功"
          else
            echo "::error::鬼斩版本发布失败（见上方响应体）"
            exit 1
          fi
