name: Build & Release

# 自动打包并发布 Release：
#   - 推送 v* 标签（如 v1.0.1）时自动发版
#   - 也可在 Actions 页面手动触发并指定标签
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签，例如 v1.0.1'
        required: true
        type: string

# 允许创建 Release 并上传产物
permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Slimefun 的 Folia fork（DEV-SNAPSHOT）在中央 / jitpack 上拉不到，
      # 因此用仓库内 lib/ 的 jar 安装到本地 Maven 仓库，覆盖 jitpack 坐标。
      - name: Install local Slimefun Folia jar
        run: |
          mvn -B install:install-file \
            -Dfile=lib/Slimefun-DEV-SNAPSHOT.jar \
            -DpomFile=lib/Slimefun4-clean.pom

      # -nsu 禁止检查远程 SNAPSHOT 更新，确保用上一步本地安装的 Folia jar，
      # 而不被 jitpack 上可能存在的同名（非 Folia）DEV-SNAPSHOT 覆盖。
      - name: Build plugin jar
        run: mvn -B -nsu clean package -DskipTests

      - name: Locate built jar
        id: built
        shell: bash
        run: |
          jar=$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' | head -n 1)
          if [ -z "$jar" ]; then
            echo "::error::未在 target/ 找到构建产物 jar"
            exit 1
          fi
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "file=$(basename "$jar")" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
          JAR_PATH: ${{ steps.built.outputs.path }}
        shell: bash
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          echo "发布标签: $tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            # 已存在的 Release（例如手动建的 pre-release）：转为正式版、刷新标题。
            gh release edit "$tag" --prerelease=false --draft=false --title "$tag"

            # 清理旧产物，但任何删除失败都不能阻断发版（|| true 容错）。
            gh release view "$tag" --json assets --jq '.assets[].id' 2>/dev/null | while read -r id; do
              [ -n "$id" ] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null 2>&1 || true
            done

            # 用规范名上传，--clobber 兜底覆盖同名旧文件，
            # 保证即使上面删除失败，release 里也只留一个最新的 jar。
            asset_name="SlimefunSmartDeviceAddon.${tag}.jar"
            cp "$JAR_PATH" "/tmp/$asset_name"
            gh release upload "$tag" "/tmp/$asset_name" --clobber
          else
            gh release create "$tag" "$JAR_PATH" --title "$tag" --generate-notes
          fi

      # 同步发布到鬼斩资源站（可选：未配置 GZ_TOKEN 时自动跳过）。
      # 复用同一次 CI 构建出的 jar，保证鬼斩与 GitHub Release 的产物完全一致。
      - name: Publish version to Guizhan Resources
        env:
          GZ_TOKEN: ${{ secrets.GZ_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
          JAR_PATH: ${{ steps.built.outputs.path }}
          GZ_PROJECT: NdmIOCAU
          GZ_API: https://resources.guizhanss.com/api/v1
          # 插件实际支持范围：服务端 Paper / Folia，MC 1.21.2 ~ 26.3 之间的全部版本。
          # MC 版本必须是鬼斩认可的值（见 GET /api/v1/data/minecraft-versions）。
          GZ_PLATFORMS: '["paper","folia"]'
          GZ_MC_VERSIONS: '["1.21.2","1.21.3","1.21.4","1.21.5","1.21.6","1.21.7","1.21.8","1.21.9","1.21.10","1.21.11","26.1","26.1.1","26.1.2","26.2","26.3"]'
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${GZ_TOKEN:-}" ]; then
            echo "::notice::未配置 GZ_TOKEN，跳过鬼斩资源站发布"
            exit 0
          fi

          if [ "$REF_TYPE" = "tag" ]; then tag="$REF_NAME"; else tag="$INPUT_TAG"; fi
          echo "鬼斩发布版本: $tag"

          # 用与 GitHub Release 完全一致的文件名，且为同一次构建产物。
          asset_name="SlimefunSmartDeviceAddon.${tag}.jar"
          gz_jar="/tmp/$asset_name"
          cp "$JAR_PATH" "$gz_jar"

          auth="Authorization: Bearer $GZ_TOKEN"
          api="$GZ_API/projects/$GZ_PROJECT"

          # 取默认 channel；草稿项目默认没有 channel，需要先建一个。
          chan_raw=$(curl -sS -w ' |HTTP=%{http_code}' -H "$auth" "$api/channels")
          channel=$(printf '%s' "${chan_raw% |HTTP=*}" | jq -r '.data[]? | select(.is_default == true) | .slug' 2>/dev/null | head -n1)
          if [ -z "$channel" ] || [ "$channel" = "null" ]; then
            echo "项目尚无 channel，创建 Release channel..."
            cc_raw=$(curl -sS -w ' |HTTP=%{http_code}' -X POST \
              -H "$auth" -H "Content-Type: application/json" \
              -d '{"slug":"release","name":"Release"}' \
              "$api/channels")
            channel=$(printf '%s' "${cc_raw% |HTTP=*}" | jq -r '.data.slug // empty' 2>/dev/null)
            if [ -z "$channel" ]; then
              echo "::error::创建 Release channel 失败：${cc_raw% |HTTP=*}"
              exit 1
            fi
          fi
          echo "使用 channel: $channel"

          # 幂等：同名版本已存在时不重复创建，但同步更新兼容平台 / MC 版本。
          # 这样调整支持范围后重跑本 workflow 即可修正已发布版本的元数据（不改动 jar）。
          ver_raw=$(curl -sS -w ' |HTTP=%{http_code}' -H "$auth" "$api/versions?search=$tag")
          existing=$(printf '%s' "${ver_raw% |HTTP=*}" | jq -r --arg v "$tag" '.data[]? | select(.version == $v) | .id' 2>/dev/null | head -n1)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            patch_data=$(jq -nc --argjson p "$GZ_PLATFORMS" --argjson m "$GZ_MC_VERSIONS" '{platforms:$p, minecraft_versions:$m}')
            patch_raw=$(curl -sS -w ' |HTTP=%{http_code}' -X PATCH \
              -H "$auth" -H "Content-Type: application/json" \
              -d "$patch_data" \
              "$api/versions?ids=$existing")
            patch_body="${patch_raw% |HTTP=*}"
            patch_code="${patch_raw##* |HTTP=}"
            if [[ "$patch_code" =~ ^2[0-9][0-9]$ ]]; then
              echo "鬼斩已存在版本 $tag（id=$existing），跳过创建；兼容性元数据已同步：$patch_data"
              # 回读确认（草稿项目公开 API 不可见，只能在带 token 的 CI 里验证）。
              curl -sS -H "$auth" "$api/versions/$existing" \
                | jq -c '{platforms: .data.platforms, minecraft_versions: .data.minecraft_versions}' 2>/dev/null || true
            else
              echo "::warning::鬼斩已存在版本 $tag（id=$existing），跳过创建；同步兼容性元数据失败（HTTP $patch_code）：${patch_body:0:400}"
            fi
            exit 0
          fi

          # changelog 与 GitHub Release 说明保持一致。
          changelog="对应 GitHub Release: https://github.com/cyantangerine/SlimefunSmartDeviceAddon/releases/tag/$tag"
          if gh release view "$tag" --json body --jq .body >/tmp/gz_changelog.md 2>/dev/null && [ -s /tmp/gz_changelog.md ]; then
            changelog=$(cat /tmp/gz_changelog.md)
          fi

          # 版本号 / 名称直接沿用 git 标签；平台与 MC 版本取自 GZ_PLATFORMS / GZ_MC_VERSIONS。
          data=$(jq -nc \
            --arg channel "$channel" \
            --arg version "$tag" \
            --arg name "$tag" \
            --arg changelog "$changelog" \
            --arg file "$asset_name" \
            --argjson platforms "$GZ_PLATFORMS" \
            --argjson mc "$GZ_MC_VERSIONS" \
            '{channel:$channel, version:$version, name:$name, changelog:$changelog, files:[$file], platforms:$platforms, minecraft_versions:$mc}')

          echo "创建鬼斩版本..."
          post_raw=$(curl -sS -w ' |HTTP=%{http_code}' -X POST \
            -H "$auth" \
            -F "data=$data" \
            -F "$asset_name=@$gz_jar" \
            "$api/versions")
          post_body="${post_raw% |HTTP=*}"
          id=$(printf '%s' "$post_body" | jq -r '.data.id // empty' 2>/dev/null)
          if [ -z "$id" ]; then
            echo "::error::鬼斩版本发布失败：$post_body"
            exit 1
          fi
          echo "鬼斩版本发布成功（id=$id）："
          printf '%s' "$post_body" | jq '{version: .data.version, channel: .data.channel.slug, files: [.data.files[] | {name, size, is_primary}]}'
