name: Build & Release

# 自动打包并发布 Release：
#   - 推送 v* 标签（如 v1.0.1）时自动发版
#   - 也可在 Actions 页面手动触发并指定标签
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签，例如 v1.0.1'
        required: true
        type: string

# 允许创建 Release 并上传产物
permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Slimefun 的 Folia fork（DEV-SNAPSHOT）在中央 / jitpack 上拉不到，
      # 因此用仓库内 lib/ 的 jar 安装到本地 Maven 仓库，覆盖 jitpack 坐标。
      - name: Install local Slimefun Folia jar
        run: |
          mvn -B install:install-file \
            -Dfile=lib/Slimefun-DEV-SNAPSHOT.jar \
            -DpomFile=lib/Slimefun4-clean.pom

      # -nsu 禁止检查远程 SNAPSHOT 更新，确保用上一步本地安装的 Folia jar，
      # 而不被 jitpack 上可能存在的同名（非 Folia）DEV-SNAPSHOT 覆盖。
      - name: Build plugin jar
        run: mvn -B -nsu clean package -DskipTests

      - name: Locate built jar
        id: built
        shell: bash
        run: |
          jar=$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' | head -n 1)
          if [ -z "$jar" ]; then
            echo "::error::未在 target/ 找到构建产物 jar"
            exit 1
          fi
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "file=$(basename "$jar")" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
          JAR_PATH: ${{ steps.built.outputs.path }}
        shell: bash
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          echo "发布标签: $tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            # 已存在的 Release（例如手动建的 pre-release）：转为正式版、刷新标题，
            # 并清掉旧产物，避免用户下载到不含最新改动的旧 jar。
            gh release edit "$tag" --prerelease=false --draft=false --title "$tag"
            gh release view "$tag" --json assets --jq '.assets[].id' | while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null
            done
            gh release upload "$tag" "$JAR_PATH" --clobber
          else
            gh release create "$tag" "$JAR_PATH" --title "$tag" --generate-notes
          fi
