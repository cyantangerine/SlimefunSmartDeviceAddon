name: Java CI

# push / PR 时的构建检查（不发布 Release）。
# 发版走 release.yml：推送 v* 标签或手动触发。
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Slimefun 的 Folia fork（DEV-SNAPSHOT）在中央 / jitpack 上拉不到，
      # 用仓库内 lib/ 的 jar 安装到本地 Maven 仓库后再构建。
      - name: Install local Slimefun Folia jar
        run: |
          mvn -B install:install-file \
            -Dfile=lib/Slimefun-DEV-SNAPSHOT.jar \
            -DpomFile=lib/Slimefun4-clean.pom

      # -nsu 禁止检查远程 SNAPSHOT 更新，确保用本地安装的 Folia jar 编译。
      - name: Build with Maven
        run: mvn -B -nsu clean package -DskipTests
